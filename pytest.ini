[pytest]
# Without this, pytest puts tests/ on sys.path but NOT the project root, so
# `import protocol` inside a test fails with ModuleNotFoundError.
pythonpath = .

testpaths = tests

# -ra shows a summary line for every non-passing test at the end.
# Don't put -q here: it cancels out -v when you ask for verbose output.
addopts = -ra
